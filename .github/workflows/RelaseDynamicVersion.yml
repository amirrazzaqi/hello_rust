name: Rust Build & Publish Dynamic Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g., v0.2.0)"
        required: true
        default: "v0.2.0"
      release_name:
        description: "Release title (e.g., Version 0.2.0)"
        required: true
        default: "Version 0.2.0"

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Package Version
        id: get_version
        shell: pwsh
        run: |
          # Use cargo pkgid to get package information including version
          $pkgid = cargo pkgid
          # Extract the version number. Example output: hello_rust v0.2.0 (...)
          # We want to extract '0.2.0'
          $version = ($pkgid -split " ")[2]
          Write-Host "Package version is: $version"
          # Set the output for use in other steps
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release project
        run: cargo build --release

      - name: Define output directory and file names
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $exeName = "hello_rust-$version.exe" # Dynamic executable name
          $zipName = "hello_rust-windows-v$version.zip" # Dynamic zip name

          # Create output directory
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Copy executable to dist with dynamic name
          Copy-Item "target/release/hello_rust.exe" "dist/$exeName" -Force
          # Create ZIP archive with dynamic name
          Compress-Archive -Path "dist/$exeName" -DestinationPath "dist/$zipName" -Force

          # Set outputs for file names to be used in the release step
          echo "executable_file=$exeName" >> $env:GITHUB_OUTPUT
          echo "zip_file=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          files: |
            dist/${{ steps.define_names.outputs.executable_file }}
            dist/${{ steps.define_names.outputs.zip_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

