name: Rust Build & Publish DYNAMIC Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"
      release_name:
        description: "Release title"
        required: true
        default: "Version 0.1.1"

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Package Version from Cargo.toml
        id: get_version
        shell: pwsh
        run: |
          $inPackage = $false
          $version = $null

          Get-Content "Cargo.toml" | ForEach-Object {
            $line = $_.Trim()

            if ($line -eq "[package]") {
              $inPackage = $true
              return
            }

            if ($inPackage -and $line -match '^version\s*=\s*"(.*)"\s*$') {
              $version = $Matches[1]
              return
            }

            if ($inPackage -and $line -match '^\[.*\]$' -and $line -ne "[package]") {
              return
            }
          }

          if (-not $version) {
            Write-Error "Could not extract version from Cargo.toml"
            exit 1
          }

          Write-Host "Package version is: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release
        run: cargo build --release

      - name: Prepare release files
        id: prepare_files
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $baseName = "hello_rust"

          $exeName = "$baseName-$version.exe"
          $zipName = "$baseName-$version.zip"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item "target/release/$baseName.exe" "dist/$exeName" -Force
          Compress-Archive -Path "dist/$exeName" -DestinationPath "dist/$zipName" -Force

          "exe_name=$exeName" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          files: |
            dist/${{ steps.prepare_files.outputs.exe_name }}
            dist/${{ steps.prepare_files.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

