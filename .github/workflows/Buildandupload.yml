name: Rust Build & Push EXE

on:
  workflow_dispatch:

permissions:
  contents: write # برای push کردن به ریپو

jobs:
  build_and_push: # نام job را تغییر دادیم تا ماهیت کار را بهتر نشان دهد
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # برای دسترسی کامل به تاریخچه Git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release project
        run: cargo build --release

      # --- مراحل جدید برای Git ---
      - name: Create output directory for executable
        run: |
          if not exist bin mkdir bin

      - name: Copy executable to bin directory
        # نام فایل اجرایی در ویندوز معمولا .exe است. اگر نام پروژه شما hello_rust است، فایل hello_rust.exe خواهد بود.
        # مسیر را مطابق با نام پروژه‌تان تنظیم کنید.
        run: copy target\release\hello_rust.exe .\bin\hello_rust.exe

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add executable to Git
        run: git add bin/hello_rust.exe

      - name: Commit changes
        run: |
          # بررسی می‌کنیم که آیا تغییری برای commit وجود دارد یا نه
          git diff --staged --quiet || git commit -m "Add/Update Windows release executable"

      - name: Push changes to repository
        # از --force-with-lease برای push امن‌تر استفاده می‌کنیم
        run: |
          git push origin HEAD:${{ github.ref }} --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- حذف مرحله Archive و Upload Artifact ---
      # شما گفتید فایل exe را در ریپو می‌خواهید، پس دیگر نیازی به ساخت zip و آپلود artifact نیست.
      # اگر همچنان می‌خواهید artifact را داشته باشید، می‌توانید این بخش را نگه دارید،
      # اما به خاطر داشته باشید که artifact و فایل exe در ریپو هر دو وجود خواهند داشت.
